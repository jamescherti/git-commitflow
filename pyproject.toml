[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-commitflow"
version = "1.2.3"
description = "A git add/commit/push helper"
readme = "README.md"
authors = [
  { name = "James Cherti" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9, <4"
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX :: Other",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
colors = ["colorama"]
proctitle = ["setproctitle"]

[project.urls]
Homepage = "https://github.com/jamescherti/git-commitflow"
Repository = "https://github.com/jamescherti/git-commitflow"

[project.scripts]
git-commitflow = "git_commitflow:git_commitflow_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_commitflow*"]
